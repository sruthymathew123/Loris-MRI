[project]
name = "cbig"
version = "27.0.0"
description = "C-BIG specific LORIS Python pipelines"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">= 3.11"
dependencies = [
    "loris-bids-utils",
    "loris-utils",
    "pillow",
]

[project.scripts]
import-png-dataset = "cbig.scripts.import_png_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cbig"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
